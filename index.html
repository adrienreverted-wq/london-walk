<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>London Step Tracker</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
    #controls { padding: 15px; background: #1e293b; color: white; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    input { padding: 8px; border-radius: 4px; border: none; width: 130px; font-size: 16px; }
    button { padding: 8px 15px; border-radius: 4px; border: none; background: #3b82f6; color: white; font-size: 16px; cursor: pointer; }
    button:hover { background: #2563eb; }
    #stats { margin-left: auto; font-size: 14px; }
    #map { flex-grow: 1; width: 100%; }
  </style>
  <script>
    const cdn = "https://" + "://cloudflare.com";
    document.write('<link rel="stylesheet" href="' + cdn + 'leaflet/1.9.4/leaflet.css" />');
    document.write('<script src="' + cdn + 'leaflet/1.9.4/leaflet.js"><\/script>');
    document.write('<script src="' + cdn + 'Turf.js/6.5.0/turf.min.js"><\/script>');
  </script>
</head>
<body>

  <div id="controls">
    <input type="number" id="stepInput" placeholder="Add steps (e.g. 5000)">
    <button onclick="addSteps()">Add Steps</button>
    <button onclick="resetProgress()" style="background: #ef4444;">Reset</button>
    <div id="stats">Total: <strong id="totalSteps">0</strong> steps (<strong id="totalKm">0.00</strong> km)</div>
  </div>

  <div id="map"></div>

  <script>
    window.onload = function() {
      const londonRouteCoords = [
        [-0.4543, 51.4700],
        [-0.3037, 51.4950],
        [-0.1657, 51.5073],
        [-0.1419, 51.5014],
        [-0.1246, 51.5007],
        [-0.1195, 51.5033],
        [-0.0984, 51.5138],
        [-0.0754, 51.5055]
      ];

      const routeLine = turf.lineString(londonRouteCoords);
      const totalRouteKm = turf.length(routeLine, { units: 'kilometers' });

      const map = L.map('map').setView([51.505, -0.15], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      const leafletCoords = londonRouteCoords.map(function(c) { return [c.at(1), c.at(0)]; });
      L.polyline(leafletCoords, { color: '#3b82f6', weight: 4, opacity: 0.7 }).addTo(map);

      let marker = L.marker(leafletCoords.at(0)).addTo(map);
      let savedSteps = parseInt(localStorage.getItem('londonSteps')) || 0;

      window.updateMap = function() {
        const kmWalked = savedSteps * 0.000762;
        const cappedKm = Math.min(kmWalked, totalRouteKm);

        const currentPoint = turf.along(routeLine, cappedKm, { units: 'kilometers' });
        const lng = currentPoint.geometry.coordinates.at(0);
        const lat = currentPoint.geometry.coordinates.at(1);

        marker.setLatLng([lat, lng]);
        map.panTo([lat, lng]);

        document.getElementById('totalSteps').innerText = savedSteps.toLocaleString();
        document.getElementById('totalKm').innerText = kmWalked.toFixed(2);
      };

      window.addSteps = function() {
        const input = document.getElementById('stepInput');
        const newSteps = parseInt(input.value);
        if (!isNaN(newSteps) && newSteps > 0) {
          savedSteps += newSteps;
          localStorage.setItem('londonSteps', savedSteps);
          input.value = '';
          window.updateMap();
        }
      };

      window.resetProgress = function() {
        if (confirm("Reset your London walk back to 0 steps?")) {
          savedSteps = 0;
          localStorage.setItem('londonSteps', 0);
          window.updateMap();
        }
      };

      window.updateMap();
    };
  </script>
</body>
</html>
